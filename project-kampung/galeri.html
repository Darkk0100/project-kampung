<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto & Video - Kampoeng Aing</title>
    <link rel="stylesheet" href="assets/css/beranda.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .grid-galeri {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            padding: 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .kartu-media {
            background: var(--warna-abu-gelap);
            border: 1px solid var(--warna-batas);
            border-radius: 8px;
            overflow: hidden;
        }
        .kartu-media img, .kartu-media video {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .judul-media {
            padding: 0.7rem;
            text-align: center;
            font-size: 0.9rem;
            color: #D1D5DB;
            border-top: 1px solid var(--warna-batas);
        }
    </style>
</head>
<body>

    <div class="lapisan-gelap" id="lapisanGelap" onclick="tutupMenu()"></div>

    <div class="menu-samping" id="menuSamping">
        <div class="tutup-menu" onclick="tutupMenu()"><i class="fa fa-times"></i></div>
        <div class="nav-menu">
            <a href="beranda.html" class="nav-btn"><i class="fa fa-home"></i> Beranda</a>
            <a href="tentang.html" class="nav-btn"><i class="fa fa-info-circle"></i> Tentang</a>
            <a href="berita.html" class="nav-btn"><i class="fa fa-newspaper-o"></i> Berita</a>
            <a href="kegiatan.html" class="nav-btn"><i class="fa fa-calendar"></i> Kegiatan</a>
            <a href="galeri.html" class="nav-btn active"><i class="fa fa-image"></i> Galeri</a>
            <a href="kontak.html" class="nav-btn"><i class="fa fa-phone"></i> Kontak</a>
            <a href="admin.html" class="nav-btn" id="linkAdmin" style="color:red; font-weight:bold; margin-top:1rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:1rem; display:none;">
                <i class="fa fa-shield"></i> Kelola Akun (Admin)
            </a>
        </div>
    </div>

    <header class="header">
        <div class="tombol-menu" onclick="bukaMenu()"><i class="fa fa-bars"></i></div>
        <h1 class="logo"><span id="namaAplikasi"></span></h1>
        <div class="header-right">
            <a href="profil.html" class="profil-btn"><i class="fa fa-user-circle"></i> <span>Profil</span></a>
            <a href="login.html" class="btn-keluar" onclick="keluarAkun()"><i class="fa fa-sign-out"></i> Keluar</a>
        </div>
    </header>

    <main class="main-container">
        <h2 style="color:var(--warna-utama); text-align:center; margin-bottom:1rem;"><i class="fa fa-picture-o"></i> Galeri Dokumentasi</h2>
        <div class="grid-galeri" id="wadahGaleri">
            <!-- Foto & Video Muncul Di Sini -->
        </div>
    </main>

    <script>
        function bukaMenu() { document.getElementById("menuSamping").classList.add("buka"); document.getElementById("lapisanGelap").classList.add("aktif"); }
        function tutupMenu() { document.getElementById("menuSamping").classList.remove("buka"); document.getElementById("lapisanGelap").classList.remove("aktif"); }
        
        window.onload = function() {
            if(!localStorage.getItem('sudahLogin')) { window.location.href = "login.html"; return; }
            if(localStorage.getItem('peranPengguna') === 'admin') document.getElementById('linkAdmin').style.display = 'flex';
            document.getElementById('namaAplikasi').innerText = localStorage.getItem('namaAplikasi') || "KAMPOENG AING";

            // ✅ TAMPILKAN SEMUA FOTO & VIDEO YANG DIUNGGAH ADMIN
            const daftar = JSON.parse(localStorage.getItem('galeriMedia')) || [];
            const wadah = document.getElementById('wadahGaleri');

            if(daftar.length === 0) {
                wadah.innerHTML = `<p style="grid-column: 1 / -1; text-align:center; color:#9CA3AF;">Belum ada foto atau video diunggah.</p>`;
                return;
            }

            daftar.forEach(item => {
                let tampilan = "";
                if(item.tipe.includes('image')) tampilan = `<img src="${item.data}" alt="${item.judul}">`;
                if(item.tipe.includes('video')) tampilan = `<video src="${item.data}" controls></video>`;

                wadah.innerHTML += `
                <div class="kartu-media">
                    ${tampilan}
                    <div class="judul-media">${item.judul}</div>
                </div>`;
            });
        };
        function keluarAkun() { localStorage.clear(); window.location.href = "login.html"; }
    </script>

</body>
</html>
