<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kampoeng Aing</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="game.js"></script>
    <style>
        /* Tambahan gaya untuk menu samping & tombol kembali */
        .tombol-kembali {
            display: inline-block;
            color: #8B5CF6;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }
        .tombol-kembali:hover {
            color: #6366F1;
        }

        /* === MENU SAMPING (SAMA PERSIS DENGAN ADMIN & GAME) === */
        .menu-samping {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background-color: #1F2937;
            border-right: 1px solid rgba(139, 92, 246, 0.2);
            z-index: 9999;
            transition: left 0.3s ease;
            padding: 1rem;
            box-shadow: 4px 0 15px rgba(0,0,0,0.2);
        }
        .menu-samping.buka {
            left: 0;
        }
        .lapisan-gelap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0,0,0,0.7);
            z-index: 9998;
            display: none;
        }
        .lapisan-gelap.aktif {
            display: block;
        }
        .tutup-menu-btn {
            text-align: right;
            margin-bottom: 1rem;
        }
        .tutup-menu-btn i {
            font-size: 1.5rem;
            color: #EF4444;
            cursor: pointer;
        }
        .nav-btn {
            display: block;
            padding: 0.8rem 1rem;
            color: #CBD5E1;
            text-decoration: none;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background-color: rgba(139, 92, 246, 0.1);
            color: #8B5CF6;
        }
    </style>
</head>
<body onload="animasiLogo()">

    <!-- ✅ MENU SAMPING & LAPISAN GELAP (WAJIB ADA AGAR GARIS TIGA BERFUNGSI) -->
    <div class="lapisan-gelap" id="lapisanGelap" onclick="tutupMenu()"></div>

    <div class="menu-samping" id="menuSamping">
        <div class="tutup-menu-btn">
            <i class="fa fa-times" onclick="tutupMenu()"></i>
        </div>
        <a href="index.html" class="nav-btn"><i class="fa fa-home"></i> Beranda</a>
        <a href="game.html" class="nav-btn"><i class="fa fa-gamepad"></i> Main Game</a>
        <a href="tentang.html" class="nav-btn"><i class="fa fa-info-circle"></i> Tentang Kami</a>
        <a href="kontak.html" class="nav-btn"><i class="fa fa-phone"></i> Kontak</a>
        <hr style="border-color:#374151; margin:1rem 0;">
        <a href="login.html" class="nav-btn"><i class="fa fa-sign-in"></i> Masuk Akun</a>
    </div>

    <header class="header">
        <div class="tombol-menu" onclick="bukaMenu()"><i class="fa fa-bars"></i></div>
        <h1 class="logo"><span id="animasiLogo"></span></h1>
    </header>

    <main class="main-container">
        <div class="content-card form-kotak">
            <!-- ✅ TOMBOL KEMBALI DITAMBAHKAN DI SINI -->
            <a href="index.html" class="tombol-kembali"><i class="fa fa-arrow-left"></i> Kembali ke Halaman Utama</a>

            <h2 class="judul-utama">Masuk Akun</h2>
            <p class="deskripsi-utama">Akun hanya dapat dibuatkan oleh Admin</p>

            <div class="form-grup">
                <label>Nama Pengguna</label>
                <input type="text" id="namaLogin" placeholder="Masukkan Nama Pengguna">
            </div>

            <div class="form-grup">
                <label>Kata Sandi</label>
                <input type="password" id="sandiLogin" placeholder="Masukkan Kata Sandi">
            </div>

            <button class="btn-login" onclick="prosesLoginUser()"><i class="fa fa-sign-in"></i> MASUK</button>
            <div class="pesan" id="pesanLogin"></div>

            <div class="info-admin">
                Jika belum memiliki akun, silakan hubungi Administrator.
            </div>
        </div>
    </main>

<script>
// ✅ FUNGSI MENU SAMPING (SAMA PERSIS DENGAN ADMIN.JS)
function bukaMenu() { 
    document.getElementById("menuSamping").classList.add("buka"); 
    document.getElementById("lapisanGelap").classList.add("aktif"); 
}
function tutupMenu() { 
    document.getElementById("menuSamping").classList.remove("buka"); 
    document.getElementById("lapisanGelap").classList.remove("aktif"); 
}

// ✅ FUNGSI LOGIN (SUDAH COCOK DENGAN ADMIN.JS)
function prosesLoginUser() {
    const namaInput = document.getElementById('namaLogin').value.trim();
    const sandiInput = document.getElementById('sandiLogin').value.trim();
    const pesan = document.getElementById('pesanLogin');

    if(!namaInput || !sandiInput) {
        pesan.innerHTML = "<span style='color:#f87171'>❌ Mohon isi Nama dan Kata Sandi!</span>";
        return;
    }

    // Ambil data dari sumber asli: daftarAkunTerdaftar
    const daftarAkun = JSON.parse(localStorage.getItem("daftarAkunTerdaftar")) || [];

    // Pengecekan sama persis saat disimpan
    const akunDitemukan = daftarAkun.find(akun => {
        return akun.nama === namaInput && akun.sandi === sandiInput;
    });

    if(akunDitemukan) {
        // ✅ BERHASIL
        localStorage.setItem("sudahLogin", "true");
        localStorage.setItem("namaPengguna", akunDitemukan.nama);
        localStorage.setItem("peranPengguna", akunDitemukan.peran);

        pesan.innerHTML = "<span style='color:#4ade80'>✅ Berhasil Masuk!<br>Halo, " + akunDitemukan.nama + " 🎉</span>";
        
        setTimeout(() => {
            window.location.href = "game.html";
        }, 1500);

    } else {
        // ❌ GAGAL
        const cekNamaAda = daftarAkun.some(akun => akun.nama === namaInput);
        
        if(cekNamaAda) {
            const dataAkun = daftarAkun.find(a => a.nama === namaInput);
            pesan.innerHTML = `
            <span style='color:#f87171'>
                ❌ Nama benar, tapi KATA SANDI SALAH.<br>
                <small>(Sandi di sistem: <b>${dataAkun.sandi}</b>)</small>
            </span>`;
        } else {
            pesan.innerHTML = "<span style='color:#f87171'>❌ Nama Pengguna tidak terdaftar.</span>";
        }
    }
}
</script>

</body>
</html>
